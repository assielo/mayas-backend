@push('scripts')
<script>
    async function fetchDashboardData() {
        try {
            const res = await fetch('/api/v1/dashboard/stats');
            const data = await res.json();
            document.getElementById('stat-visitors').innerText = data.on_site_count ?? 0;
            document.getElementById('stat-vehicles').innerText = data.vehicles_count ?? 0;
            document.getElementById('stat-duration').innerText = (data.avg_visit_duration ?? 0) + ' min';
            document.getElementById('stat-mdm').innerText = `${data.active_devices ?? 0} / ${data.total_devices ?? 0}`;
        } catch (e) { console.error(e); }
    }
    fetchDashboardData();
    setInterval(fetchDashboardData, 10000); // Auto-refresh toutes les 10s
</script>
@endpush
